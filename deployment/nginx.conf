# Include in an HTTPS server block after setting $taurus_backend and $taurus_app.
# Default Taurus http.requestPrefix: /_taurus. For another prefix use render-proxy.py.
location = /_taurus/auth {
    internal;
    proxy_pass $taurus_backend/_taurus/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Taurus-User "";
    proxy_set_header X-Taurus-User-Id "";
    proxy_set_header X-Taurus-Tenant "";
}

location /_taurus/ {
    proxy_pass $taurus_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Taurus-User "";
    proxy_set_header X-Taurus-User-Id "";
    proxy_set_header X-Taurus-Tenant "";
}

location / {
    auth_request /_taurus/auth;
    auth_request_set $taurus_user $upstream_http_x_taurus_user;
    auth_request_set $taurus_id $upstream_http_x_taurus_user_id;
    auth_request_set $taurus_tenant $upstream_http_x_taurus_tenant;
    error_page 401 = @taurus_login;
    proxy_set_header X-Taurus-User $taurus_user;
    proxy_set_header X-Taurus-User-Id $taurus_id;
    proxy_set_header X-Taurus-Tenant $taurus_tenant;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass $taurus_app;
}

location @taurus_login {
    return 302 /_taurus/ui/;
}

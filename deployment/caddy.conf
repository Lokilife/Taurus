# Set taurus_backend and taurus_app with vars, then import taurus in the site.
(taurus) {
    route {
        request_header -X-Taurus-User
        request_header -X-Taurus-User-Id
        request_header -X-Taurus-Tenant
        handle /_taurus/* {
            reverse_proxy {http.vars.taurus_backend} {
                header_up Host {http.request.hostport}
                header_up X-Forwarded-Host {http.request.hostport}
                header_up X-Forwarded-Proto {http.request.scheme}
                header_up X-Forwarded-For {http.request.remote.host}
            }
        }
        handle {
            forward_auth {http.vars.taurus_backend} {
                uri /_taurus/auth
                header_up Host {http.request.hostport}
                header_up X-Forwarded-Host {http.request.hostport}
                header_up X-Forwarded-Proto {http.request.scheme}
                header_up X-Forwarded-For {http.request.remote.host}
                copy_headers X-Taurus-User X-Taurus-User-Id X-Taurus-Tenant
            }
            reverse_proxy {http.vars.taurus_app} {
                header_up -Cookie
                header_up -Authorization
            }
        }
    }
}

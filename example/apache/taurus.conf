# Publishes Taurus itself; DOES NOT protect another application.
# Requires mod_ssl, mod_headers, mod_proxy and mod_proxy_http.
<VirtualHost *:443>
    ServerName id.example.com
    SSLEngine on
    SSLCertificateFile /etc/apache2/tls/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/tls/key.pem
    ProxyPreserveHost On
    RequestHeader unset X-Taurus-User
    RequestHeader unset X-Taurus-User-Id
    RequestHeader unset X-Taurus-Tenant
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-For
    ProxyPass / http://127.0.0.1:5080/
    ProxyPassReverse / http://127.0.0.1:5080/
</VirtualHost>

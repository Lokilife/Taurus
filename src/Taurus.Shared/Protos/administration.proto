syntax = "proto3";
package taurus.v1;
option csharp_namespace = "Taurus.Shared";
import "authentication.proto";

// Tenant administration on the configured admin origin only. Every call requires
// an enabled bootstrap-root session. Tenant and actor are resolved server-side.
// Unknown request fields are rejected recursively. Errors use INVALID_ARGUMENT,
// UNAUTHENTICATED, PERMISSION_DENIED, CANCELLED or UNAVAILABLE without secrets.
service Administration {
  // Checks access without returning credentials, session tokens or identity data.
  // Uses the HttpOnly session cookie; does not change account state.
  rpc CheckAccess (EmptyRequest) returns (EmptyResponse);
}
